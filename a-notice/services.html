<!doctype html>
<html lang="zh-Hant-TW" data-style="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服務項目｜範例營造股份有限公司</title>
<meta name="description" content="範例營造股份有限公司的服務項目：廠房、住宅與加油站新建工程，以及各項服務的相關工程實績。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../shared/img/logo-mark.png" width="44" height="44" alt="">
      <span class="brand-text">
        <span class="brand-name" data-bind="company.shortName"></span>
        <span class="brand-en" lang="en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="nav-toggle-text">選單</span>
    </button>
    <nav class="site-nav" id="site-nav" data-nav aria-label="主要選單">
      <ul class="nav-list" role="list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a class="header-call" data-attr="href:company.phoneHref">
        <span class="header-call-label">電話</span>
        <span class="header-call-num" data-bind="company.phone"></span>
      </a>
      <a class="btn btn--sm header-cta" href="contact.html">工程洽詢</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="page-head" aria-labelledby="page-title">
    <div class="wrap">
      <p class="page-en" lang="en">SERVICES</p>
      <h1 class="page-title" id="page-title">服務項目</h1>
      <p class="page-lead" data-bind="copy.servicesLead"></p>
    </div>
  </section>

  <div class="service-list">
    <template data-each="services">
      <section class="section service-block" data-attr="id:item.id; aria-label:item.name">
        <div class="wrap">
          <div class="board-head">
            <h2 class="board-title" data-bind="item.name"></h2>
            <p class="board-en" lang="en" data-bind="item.en"></p>
          </div>
          <div class="service-detail">
            <div class="service-detail-ph" data-attr="data-illus:item.illus" data-ph-label="工程照片待補"></div>
            <div class="service-detail-body">
              <p class="lead" data-bind="item.desc"></p>
              <div class="ref">
                <h3 class="ref-title">相關實績<span class="ref-count"><span class="num" data-bind="item.$count"></span> 件</span></h3>
                <ul class="ref-list" role="list">
                  <template data-each="item.$projects">
                    <li>
                      <a class="ref-link" data-attr="href:item.$href">
                        <span class="ref-name" data-bind="item.name"></span>
                        <span class="ref-meta"><span data-bind="item.location"></span><span><span data-bind="item.year"></span> 年完工</span></span>
                      </a>
                    </li>
                  </template>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </template>
  </div>

  <section class="cta on-dark" aria-labelledby="cta-title">
    <div class="wrap cta-grid">
      <div class="cta-copy">
        <h2 class="board-title cta-title" id="cta-title" data-bind="copy.ctaTitle"></h2>
        <p class="cta-text" data-bind="copy.ctaText"></p>
      </div>
      <div class="cta-contact">
        <p class="cta-label">洽詢電話</p>
        <a class="cta-phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
        <a class="btn btn--light" href="contact.html">工程洽詢</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer on-dark">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <img class="footer-mark" src="../shared/img/logo-mark.png" width="48" height="48" alt="">
      <p class="footer-name" data-bind="company.name"></p>
      <p class="footer-en" lang="en" data-bind="company.nameEn"></p>
      <dl class="footer-reg">
        <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
        <div><dt>統一編號</dt><dd data-bind="company.taxId"></dd></div>
      </dl>
    </div>
    <div class="footer-col">
      <h2 class="footer-head">聯絡資訊</h2>
      <dl class="footer-info">
        <div><dt>地址</dt><dd data-bind="company.address"></dd></div>
        <div><dt>電話</dt><dd><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
        <div><dt>傳真</dt><dd data-bind="company.fax"></dd></div>
        <div><dt>Email</dt><dd><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
        <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
      </dl>
    </div>
    <nav class="footer-col footer-nav" aria-label="頁尾導覽">
      <h2 class="footer-head">網站導覽</h2>
      <ul role="list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="wrap footer-bottom">
    <p>© <span data-bind="$year"></span> <span data-bind="company.name"></span></p>
  </div>
</footer>
</body>
</html>
