<!doctype html>
<html lang="zh-Hant-TW" data-style="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程實績｜範例營造股份有限公司</title>
<meta name="description" content="範例營造股份有限公司工程實績案件內容：工程類型、地點、完工年份、規模、業主與案場照片。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
</head>
<body data-page="project">
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../shared/img/logo-mark.png" width="44" height="44" alt="">
      <span class="brand-text">
        <span class="brand-name" data-bind="company.shortName"></span>
        <span class="brand-en" lang="en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="nav-toggle-text">選單</span>
    </button>
    <nav class="site-nav" id="site-nav" data-nav aria-label="主要選單">
      <ul class="nav-list" role="list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a class="header-call" data-attr="href:company.phoneHref">
        <span class="header-call-label">電話</span>
        <span class="header-call-num" data-bind="company.phone"></span>
      </a>
      <a class="btn btn--sm header-cta" href="contact.html">工程洽詢</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="page-head page-head--project" aria-labelledby="page-title">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="麵包屑">
        <ol role="list">
          <li><a href="projects.html">工程實績</a></li>
          <li><span aria-current="page" data-bind="project.name"></span></li>
        </ol>
      </nav>
      <p class="page-tag" data-bind="project.typeFull"></p>
      <h1 class="page-title" id="page-title" data-bind="project.name"></h1>
    </div>
  </section>

  <section class="section" aria-labelledby="spec-title">
    <div class="wrap project-grid">
      <div class="project-spec">
        <div class="board-head">
          <h2 class="board-title" id="spec-title">工程概要</h2>
          <p class="board-en" lang="en">PROJECT DATA</p>
        </div>
        <table class="board-table" aria-labelledby="spec-title">
          <tbody>
            <tr><th scope="row">工程類型</th><td data-bind="project.typeFull"></td></tr>
            <tr><th scope="row">工程地點</th><td data-bind="project.location"></td></tr>
            <tr><th scope="row">完工年份</th><td><span data-bind="project.year"></span> 年</td></tr>
            <tr><th scope="row">規模</th><td data-bind="project.scale"></td></tr>
            <tr data-if="project.owner"><th scope="row">業主</th><td data-bind="project.owner"></td></tr>
            <tr><th scope="row">承造廠商</th><td data-bind="company.name"></td></tr>
          </tbody>
        </table>
      </div>
      <div class="project-summary">
        <div class="board-head">
          <h2 class="board-title" id="summary-title">案件說明</h2>
          <p class="board-en" lang="en">SUMMARY</p>
        </div>
        <p class="lead" data-bind="project.summary"></p>
        <p class="more"><a class="text-link" href="contact.html">洽詢類似工程<span aria-hidden="true">→</span></a></p>
      </div>
    </div>
  </section>

  <section class="section section--mist" aria-labelledby="gallery-title">
    <div class="wrap">
      <div class="board-head">
        <h2 class="board-title" id="gallery-title">案場照片</h2>
        <p class="board-en" lang="en">PHOTOS</p>
      </div>
      <div class="gallery">
        <template data-each="project.$gallery"><figure class="gallery-ph" data-attr="data-illus:item.illus; data-ph-label:item.label"></figure></template>
      </div>
    </div>
  </section>

  <nav class="pager" aria-label="上一件與下一件">
    <div class="wrap pager-grid">
      <a class="pager-link pager-link--prev" data-attr="href:project.$prev.$href">
        <span class="pager-label"><span aria-hidden="true">←</span> 上一件</span>
        <span class="pager-name" data-bind="project.$prev.name"></span>
      </a>
      <a class="pager-link pager-link--next" data-attr="href:project.$next.$href">
        <span class="pager-label">下一件 <span aria-hidden="true">→</span></span>
        <span class="pager-name" data-bind="project.$next.name"></span>
      </a>
    </div>
  </nav>

  <section class="cta on-dark" aria-labelledby="cta-title">
    <div class="wrap cta-grid">
      <div class="cta-copy">
        <h2 class="board-title cta-title" id="cta-title" data-bind="copy.ctaTitle"></h2>
        <p class="cta-text" data-bind="copy.ctaText"></p>
      </div>
      <div class="cta-contact">
        <p class="cta-label">洽詢電話</p>
        <a class="cta-phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
        <a class="btn btn--light" href="contact.html">工程洽詢</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer on-dark">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <img class="footer-mark" src="../shared/img/logo-mark.png" width="48" height="48" alt="">
      <p class="footer-name" data-bind="company.name"></p>
      <p class="footer-en" lang="en" data-bind="company.nameEn"></p>
      <dl class="footer-reg">
        <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
        <div><dt>統一編號</dt><dd data-bind="company.taxId"></dd></div>
      </dl>
    </div>
    <div class="footer-col">
      <h2 class="footer-head">聯絡資訊</h2>
      <dl class="footer-info">
        <div><dt>地址</dt><dd data-bind="company.address"></dd></div>
        <div><dt>電話</dt><dd><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
        <div><dt>傳真</dt><dd data-bind="company.fax"></dd></div>
        <div><dt>Email</dt><dd><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
        <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
      </dl>
    </div>
    <nav class="footer-col footer-nav" aria-label="頁尾導覽">
      <h2 class="footer-head">網站導覽</h2>
      <ul role="list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="wrap footer-bottom">
    <p>© <span data-bind="$year"></span> <span data-bind="company.name"></span></p>
  </div>
</footer>
</body>
</html>
