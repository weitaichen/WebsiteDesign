<!doctype html>
<html lang="zh-Hant-TW" data-style="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程實績｜範例營造</title>
<meta name="description" content="範例營造工程實績案件內頁：工程類型、地點、完工年份、規模、業主與案場照片。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
</head>
<body data-page="project">
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="../shared/img/logo-mark.png" srcset="../shared/img/logo-mark.png 1x, ../shared/img/logo-mark@2x.png 2x" width="36" height="36" alt="">
      <span class="brand__type">
        <span class="brand__name" data-bind="company.shortName"></span>
        <span class="brand__en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle__label">選單</span>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主選單">
      <ul class="site-nav__list" role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
      <div class="site-nav__contact">
        <a class="site-nav__phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
        <a class="site-nav__cta" href="contact.html">工程洽詢</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">

  <header class="page-head page-head--project">
    <div class="container page-head__inner">
      <nav class="breadcrumb" aria-label="麵包屑">
        <ol role="list">
          <li><a href="projects.html">工程實績</a></li>
          <li aria-current="page" data-bind="project.name"></li>
        </ol>
      </nav>
      <p class="tag" data-bind="project.typeFull"></p>
      <h1 class="page-title page-title--project" data-bind="project.name"></h1>
    </div>
  </header>

  <section class="section" aria-labelledby="spec-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">Specification</p>
        <h2 class="section-title" id="spec-title">工程概要</h2>
      </header>
      <div class="spec">
        <dl class="datasheet">
          <div><dt>工程類型</dt><dd data-bind="project.typeFull"></dd></div>
          <div><dt>工程地點</dt><dd data-bind="project.location"></dd></div>
          <div><dt>完工年份</dt><dd><span class="num" data-bind="project.year"></span> 年</dd></div>
          <div><dt>規模</dt><dd data-bind="project.scale"></dd></div>
          <div data-if="project.owner"><dt>業主</dt><dd data-bind="project.owner"></dd></div>
        </dl>
        <div class="summary">
          <h3 class="summary__title">案件說明</h3>
          <p class="summary__text" data-bind="project.summary"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="gallery-title">
    <div class="container">
      <header class="section-head">
        <p class="eyebrow">Photographs</p>
        <h2 class="section-title" id="gallery-title">案場照片</h2>
      </header>
      <ul class="gallery" role="list">
        <template data-each="project.$gallery">
          <li><figure class="gallery__item" data-attr="data-illus:item.illus; data-ph-label:item.label"></figure></li>
        </template>
      </ul>
    </div>
  </section>

  <nav class="pager" aria-label="其他案件">
    <div class="container pager__inner">
      <a class="pager__link pager__link--prev" data-attr="href:project.$prev.$href">
        <span class="pager__dir">上一件</span>
        <span class="pager__name" data-bind="project.$prev.name"></span>
      </a>
      <a class="pager__link pager__link--next" data-attr="href:project.$next.$href">
        <span class="pager__dir">下一件</span>
        <span class="pager__name" data-bind="project.$next.name"></span>
      </a>
    </div>
  </nav>

  <section class="section cta" aria-labelledby="cta-title">
    <div class="container split cta__inner">
      <header class="section-head">
        <span class="ties" aria-hidden="true"></span>
        <h2 class="section-title" id="cta-title" data-bind="copy.ctaTitle"></h2>
      </header>
      <div class="cta__body">
        <p class="cta__text" data-bind="copy.ctaText"></p>
        <div class="cta__actions">
          <a class="cta__phone" data-attr="href:company.phoneHref">
            <span class="cta__phone-label">來電洽詢</span>
            <span class="cta__phone-number" data-bind="company.phone"></span>
          </a>
          <a class="button" href="contact.html">工程洽詢</a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="footer-id">
      <p class="footer-id__name" data-bind="company.name"></p>
      <p class="footer-id__en" data-bind="company.nameEn"></p>
    </div>
    <dl class="footer-facts">
      <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
      <div><dt>統一編號</dt><dd class="num" data-bind="company.taxId"></dd></div>
      <div><dt>地址</dt><dd data-bind="company.address"></dd></div>
      <div><dt>電話</dt><dd class="num"><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
      <div><dt>傳真</dt><dd class="num" data-bind="company.fax"></dd></div>
      <div><dt>Email</dt><dd class="num"><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
      <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
    </dl>
    <nav class="footer-nav" aria-label="頁尾選單">
      <ul role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="site-footer__base">
    <p><small>© <span class="num" data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
  </div>
</footer>
</body>
</html>
