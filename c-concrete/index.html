<!doctype html>
<html lang="zh-Hant-TW" data-style="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>範例營造｜安全 品質 技術 服務</title>
<meta name="description" content="範例營造股份有限公司，台中市的丙等綜合營造業，承攬廠房、住宅與加油站新建工程。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="../shared/img/logo-mark.png" srcset="../shared/img/logo-mark.png 1x, ../shared/img/logo-mark@2x.png 2x" width="36" height="36" alt="">
      <span class="brand__type">
        <span class="brand__name" data-bind="company.shortName"></span>
        <span class="brand__en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle__label">選單</span>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主選單">
      <ul class="site-nav__list" role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
      <div class="site-nav__contact">
        <a class="site-nav__phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
        <a class="site-nav__cta" href="contact.html">工程洽詢</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">

  <section class="hero" aria-labelledby="hero-title">
    <div class="wall">
      <div class="wall__face">
        <h1 class="wall__slogan" id="hero-title" data-attr="aria-label:company.slogan"><template data-each="company.slogan"><span class="wall__word" data-bind="item"></span></template></h1>
      </div>
    </div>
    <div class="container hero__base">
      <p class="hero__id">
        <span class="hero__name" data-bind="company.name"></span>
        <span data-bind="company.grade"></span>
        <span data-bind="company.city"></span>
      </p>
      <div class="hero__actions">
        <a class="button" href="projects.html">看工程實績</a>
        <a class="button button--quiet" href="contact.html">工程洽詢</a>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="facts-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">Profile</p>
        <h2 class="section-title" id="facts-title">公司概況</h2>
      </header>
      <dl class="facts">
        <template data-each="facts">
          <div class="fact">
            <dt class="fact__label" data-bind="item.label"></dt>
            <dd class="fact__data"><span class="fact__value" data-bind="item.value"></span><span class="fact__unit" data-bind="item.unit"></span></dd>
          </div>
        </template>
      </dl>
    </div>
  </section>

  <section class="section" aria-labelledby="intro-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">About</p>
        <h2 class="section-title" id="intro-title">關於我們</h2>
      </header>
      <div class="intro">
        <p class="lede" data-bind="copy.intro"></p>
        <p class="more"><a class="text-link" href="about.html">公司簡介與登記資料</a></p>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="services-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">Services</p>
        <h2 class="section-title" id="services-title">服務項目</h2>
        <p class="section-head__link"><a class="text-link" href="services.html">服務說明</a></p>
      </header>
      <ul class="panels" role="list">
        <template data-each="services">
          <li class="panel">
            <p class="panel__en" data-bind="item.en"></p>
            <h3 class="panel__name"><a class="stretched" data-attr="href:item.$href" data-bind="item.name"></a></h3>
            <p class="panel__desc" data-bind="item.desc"></p>
            <figure class="panel__media" data-attr="data-illus:item.illus" data-ph-label="服務照片待補"></figure>
            <p class="panel__count"><span class="num" data-bind="item.$count"></span> 件實績</p>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <section class="section" aria-labelledby="works-title">
    <div class="container">
      <header class="section-head section-head--bar">
        <div class="section-head__titles">
          <p class="eyebrow">Selected works</p>
          <h2 class="section-title" id="works-title">精選實績</h2>
        </div>
        <p class="section-head__link"><a class="text-link" href="projects.html">全部工程實績</a></p>
      </header>
      <ul class="works" role="list">
        <template data-each="projects" data-where="featured=true">
          <li class="work" data-reveal>
            <figure class="work__media" data-attr="data-illus:item.illus" data-ph-label="案場照片待補｜橫式 3:2"></figure>
            <div class="work__text">
              <h3 class="work__name"><a class="stretched" data-attr="href:item.$href" data-bind="item.name"></a></h3>
              <p class="work__type" data-bind="item.typeFull"></p>
              <p class="work__loc" data-bind="item.location"></p>
              <p class="work__year num" data-bind="item.year"></p>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <section class="section cta" aria-labelledby="cta-title">
    <div class="container split cta__inner">
      <header class="section-head">
        <span class="ties" aria-hidden="true"></span>
        <h2 class="section-title" id="cta-title" data-bind="copy.ctaTitle"></h2>
      </header>
      <div class="cta__body">
        <p class="cta__text" data-bind="copy.ctaText"></p>
        <div class="cta__actions">
          <a class="cta__phone" data-attr="href:company.phoneHref">
            <span class="cta__phone-label">來電洽詢</span>
            <span class="cta__phone-number" data-bind="company.phone"></span>
          </a>
          <a class="button" href="contact.html">工程洽詢</a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="footer-id">
      <p class="footer-id__name" data-bind="company.name"></p>
      <p class="footer-id__en" data-bind="company.nameEn"></p>
    </div>
    <dl class="footer-facts">
      <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
      <div><dt>統一編號</dt><dd class="num" data-bind="company.taxId"></dd></div>
      <div><dt>地址</dt><dd data-bind="company.address"></dd></div>
      <div><dt>電話</dt><dd class="num"><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
      <div><dt>傳真</dt><dd class="num" data-bind="company.fax"></dd></div>
      <div><dt>Email</dt><dd class="num"><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
      <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
    </dl>
    <nav class="footer-nav" aria-label="頁尾選單">
      <ul role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="site-footer__base">
    <p><small>© <span class="num" data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
  </div>
</footer>
</body>
</html>
