<!doctype html>
<html lang="zh-Hant-TW" data-style="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>關於我們｜範例營造</title>
<meta name="description" content="範例營造股份有限公司的公司簡介、經營理念、公司登記資料與營造業證照。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="../shared/img/logo-mark.png" srcset="../shared/img/logo-mark.png 1x, ../shared/img/logo-mark@2x.png 2x" width="36" height="36" alt="">
      <span class="brand__type">
        <span class="brand__name" data-bind="company.shortName"></span>
        <span class="brand__en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle__label">選單</span>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主選單">
      <ul class="site-nav__list" role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
      <div class="site-nav__contact">
        <a class="site-nav__phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
        <a class="site-nav__cta" href="contact.html">工程洽詢</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">

  <header class="page-head">
    <div class="container page-head__inner">
      <p class="eyebrow">About us</p>
      <h1 class="page-title">關於我們</h1>
    </div>
  </header>

  <section class="section" aria-labelledby="profile-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">Profile</p>
        <h2 class="section-title" id="profile-title">公司簡介</h2>
      </header>
      <div class="prose">
        <p class="lede" data-bind="copy.intro"></p>
        <p data-bind="copy.philosophy"></p>
      </div>
    </div>
    <div class="container">
      <figure class="about-figure" data-illus="building" data-ph-label="公司／團隊形象照待補"></figure>
    </div>
  </section>

  <section class="section" aria-labelledby="values-title">
    <div class="container">
      <header class="section-head">
        <p class="eyebrow">Philosophy</p>
        <h2 class="section-title" id="values-title">經營理念</h2>
      </header>
      <ul class="values" role="list">
        <template data-each="values">
          <li class="value">
            <p class="value__en" data-bind="item.en"></p>
            <h3 class="value__title" data-bind="item.title"></h3>
            <p class="value__desc" data-bind="item.desc"></p>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <section class="section" aria-labelledby="data-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">Company data</p>
        <h2 class="section-title" id="data-title">公司資料</h2>
      </header>
      <dl class="datasheet">
        <div><dt>公司名稱</dt><dd data-bind="company.name"></dd></div>
        <div><dt>英文名稱</dt><dd class="num" data-bind="company.nameEn"></dd></div>
        <div><dt>統一編號</dt><dd class="num" data-bind="company.taxId"></dd></div>
        <div><dt>成立年份</dt><dd><span class="num" data-bind="company.founded"></span> 年</dd></div>
        <div><dt>資本額</dt><dd data-bind="company.capital"></dd></div>
        <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
        <div><dt>營造業等級</dt><dd data-bind="company.grade"></dd></div>
        <div><dt>負責人</dt><dd data-bind="company.representative"></dd></div>
        <div><dt>公司地址</dt><dd data-bind="company.address"></dd></div>
      </dl>
    </div>
  </section>

  <section class="section" aria-labelledby="certs-title">
    <div class="container split">
      <header class="section-head">
        <p class="eyebrow">Certificates</p>
        <h2 class="section-title" id="certs-title">證照</h2>
      </header>
      <ul class="certs" role="list">
        <template data-each="certificates">
          <li class="cert">
            <figure class="cert__media" data-attr="data-illus:item.illus" data-ph-label="證照圖檔待補"></figure>
            <h3 class="cert__title" data-bind="item.title"></h3>
            <p class="cert__detail" data-bind="item.detail"></p>
          </li>
        </template>
      </ul>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="footer-id">
      <p class="footer-id__name" data-bind="company.name"></p>
      <p class="footer-id__en" data-bind="company.nameEn"></p>
    </div>
    <dl class="footer-facts">
      <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
      <div><dt>統一編號</dt><dd class="num" data-bind="company.taxId"></dd></div>
      <div><dt>地址</dt><dd data-bind="company.address"></dd></div>
      <div><dt>電話</dt><dd class="num"><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
      <div><dt>傳真</dt><dd class="num" data-bind="company.fax"></dd></div>
      <div><dt>Email</dt><dd class="num"><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
      <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
    </dl>
    <nav class="footer-nav" aria-label="頁尾選單">
      <ul role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="site-footer__base">
    <p><small>© <span class="num" data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
  </div>
</footer>
</body>
</html>
