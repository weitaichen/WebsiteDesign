<!doctype html>
<html lang="zh-Hant-TW" data-style="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯絡我們｜範例營造</title>
<meta name="description" content="聯絡範例營造：電話、傳真、Email、公司地址與營業時間，也可以填寫工程洽詢表單。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="../shared/img/logo-mark.png" srcset="../shared/img/logo-mark.png 1x, ../shared/img/logo-mark@2x.png 2x" width="36" height="36" alt="">
      <span class="brand__type">
        <span class="brand__name" data-bind="company.shortName"></span>
        <span class="brand__en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle__label">選單</span>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主選單">
      <ul class="site-nav__list" role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
      <div class="site-nav__contact">
        <a class="site-nav__phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
        <a class="site-nav__cta" href="contact.html">工程洽詢</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">

  <header class="page-head">
    <div class="container page-head__inner">
      <p class="eyebrow">Contact</p>
      <h1 class="page-title">聯絡我們</h1>
      <p class="page-lead" data-bind="copy.contactLead"></p>
    </div>
  </header>

  <section class="section" aria-label="聯絡資訊與洽詢表單">
    <div class="container contact-grid">

      <div class="contact-info">
        <h2 class="section-title">聯絡資訊</h2>
        <dl class="contact-list">
          <div>
            <dt>電話</dt>
            <dd><a class="contact-phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd>
          </div>
          <div>
            <dt>傳真</dt>
            <dd class="num" data-bind="company.fax"></dd>
          </div>
          <div>
            <dt>Email</dt>
            <dd class="num"><a class="text-link text-link--plain" data-attr="href:company.emailHref" data-bind="company.email"></a></dd>
          </div>
          <div>
            <dt>地址</dt>
            <dd>
              <span class="contact-address" data-bind="company.address"></span>
              <a class="text-link" data-map-link>在 Google 地圖開啟</a>
            </dd>
          </div>
          <div>
            <dt>營業時間</dt>
            <dd data-bind="company.hours"></dd>
          </div>
        </dl>
      </div>

      <form class="form" data-demo-form aria-labelledby="form-title">
        <h2 class="section-title" id="form-title">工程洽詢表單</h2>
        <div class="form__fields">
          <div class="field">
            <label for="f-name">姓名<span class="field__req">必填</span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-tel">聯絡電話<span class="field__req">必填</span></label>
            <input id="f-tel" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email">
          </div>
          <div class="field">
            <label for="f-type">工程類型</label>
            <select id="f-type" name="type">
              <option value="">請選擇</option>
              <template data-each="form.types"><option data-attr="value:item" data-bind="item"></option></template>
            </select>
          </div>
          <div class="field field--wide">
            <label for="f-message">需求說明<span class="field__req">必填</span></label>
            <textarea id="f-message" name="message" rows="6" required></textarea>
          </div>
        </div>
        <div class="form__foot">
          <p class="form-consent">
            <label><input type="checkbox" name="consent" required>我已閱讀並同意<a href="privacy.html">隱私權政策</a>，並同意<span data-bind="company.shortName"></span>為聯絡與工程洽詢的目的處理我提供的個人資料。</label>
          </p>
          <button class="button" type="submit">送出洽詢</button>
          <p class="form__status" data-form-status hidden></p>
          <p class="form__note"><small data-bind="form.note"></small></p>
        </div>
      </form>

    </div>
  </section>

  <section class="section" aria-labelledby="map-title">
    <div class="container">
      <header class="section-head">
        <p class="eyebrow">Location</p>
        <h2 class="section-title" id="map-title">公司位置</h2>
      </header>
      <div class="map">
        <iframe data-map></iframe>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="footer-id">
      <p class="footer-id__name" data-bind="company.name"></p>
      <p class="footer-id__en" data-bind="company.nameEn"></p>
    </div>
    <dl class="footer-facts">
      <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
      <div><dt>統一編號</dt><dd class="num" data-bind="company.taxId"></dd></div>
      <div><dt>地址</dt><dd data-bind="company.address"></dd></div>
      <div><dt>電話</dt><dd class="num"><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
      <div><dt>傳真</dt><dd class="num" data-bind="company.fax"></dd></div>
      <div><dt>Email</dt><dd class="num"><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
      <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
    </dl>
    <nav class="footer-nav" aria-label="頁尾選單">
      <ul role="list" data-nav>
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="site-footer__base">
    <p><small>© <span class="num" data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
  </div>
</footer>
</body>
</html>
