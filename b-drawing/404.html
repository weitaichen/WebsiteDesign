<!doctype html>
<html lang="zh-Hant-TW" data-style="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到頁面｜範例營造股份有限公司</title>
<meta name="description" content="您要找的頁面不存在，請從首頁或工程實績重新瀏覽。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
<script src="style.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="../shared/img/logo-mark.png" width="44" height="44" alt="">
        <span class="brand-text">
          <span class="brand-name" data-bind="company.shortName"></span>
          <span class="brand-en" data-bind="company.shortNameEn"></span>
        </span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-menu">
        <span class="nav-toggle-icon" aria-hidden="true"></span>
        <span class="nav-toggle-text">選單</span>
      </button>
      <div class="nav-panel" id="site-menu">
        <nav class="site-nav" data-nav aria-label="主選單">
          <ul role="list">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="services.html">服務項目</a></li>
            <li><a href="projects.html">工程實績</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
          </ul>
        </nav>
        <div class="header-contact">
          <a class="header-tel" data-attr="href:company.phoneHref"><span class="tag-mono" aria-hidden="true">TEL</span><span data-bind="company.phone"></span></a>
          <a class="btn btn-primary btn-sm" href="contact.html">工程洽詢</a>
        </div>
      </div>
    </div>
  </header>

<main id="main">
  <section class="simple-page">
    <div class="simple-page__inner">
    <h1>找不到這個頁面</h1>
    <p>網址可能輸入錯誤，或這個頁面已經移動。您可以從下面重新開始瀏覽。</p>
    <p class="actions">
      <a class="btn btn-primary" href="index.html">回首頁</a>
      <a class="btn btn-primary" href="projects.html">看工程實績</a>
      <a class="btn btn-primary" href="contact.html">工程洽詢</a>
    </p>
    </div>
  </section>
</main>

<footer class="title-block">
    <div class="tb-grid">
      <div class="tb-cell tb-contractor">
        <img class="tb-mark" src="../shared/img/logo-mark.png" width="40" height="40" alt="">
        <dl>
          <dt>承造人<span>CONTRACTOR</span></dt>
          <dd class="tb-name" data-bind="company.name"></dd>
          <dd class="tb-en" data-bind="company.nameEn"></dd>
        </dl>
      </div>
      <dl class="tb-cell tb-license">
        <dt>營造業登記證<span>LICENSE</span></dt>
        <dd data-bind="company.license"></dd>
      </dl>
      <dl class="tb-cell tb-tax">
        <dt>統一編號<span>TAX ID</span></dt>
        <dd class="num" data-bind="company.taxId"></dd>
      </dl>
      <dl class="tb-cell tb-sheet">
        <dt>圖名<span>SHEET</span></dt>
        <dd class="tb-sheet-name">首頁</dd>
      </dl>
      <dl class="tb-cell tb-address">
        <dt>地址<span>ADDRESS</span></dt>
        <dd data-bind="company.address"></dd>
      </dl>
      <dl class="tb-cell tb-phone">
        <dt>電話／傳真<span>TEL / FAX</span></dt>
        <dd class="num"><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd>
        <dd class="num"><span class="tb-sub">傳真</span><span data-bind="company.fax"></span></dd>
      </dl>
      <dl class="tb-cell tb-date">
        <dt>更新日期<span>DATE</span></dt>
        <dd class="num" data-bind="meta.updated"></dd>
      </dl>
      <dl class="tb-cell tb-mail">
        <dt>Email／營業時間<span>MAIL / HOURS</span></dt>
        <dd><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd>
        <dd data-bind="company.hours"></dd>
      </dl>
      <nav class="tb-cell tb-nav" aria-label="頁尾導覽">
        <p class="tb-label">索引<span>INDEX</span></p>
        <ul role="list">
          <li><a href="index.html">首頁</a></li>
          <li><a href="about.html">關於我們</a></li>
          <li><a href="services.html">服務項目</a></li>
          <li><a href="projects.html">工程實績</a></li>
          <li><a href="contact.html">聯絡我們</a></li>
        </ul>
      </nav>
      <p class="tb-cell tb-copy"><small>© <span data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
    </div>
  </footer>
</body>
</html>
