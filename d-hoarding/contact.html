<!doctype html>
<html lang="zh-Hant-TW" data-style="d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯絡我們｜範例營造股份有限公司</title>
<meta name="description" content="範例營造股份有限公司聯絡資訊：電話、傳真、Email、地址與營業時間，並可線上留言洽詢工程。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
<script src="style.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../shared/img/logo-mark.png" alt="" width="44" height="44">
      <span class="brand-text">
        <span class="brand-name" data-bind="company.shortName"></span>
        <span class="brand-en" lang="en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="nav-toggle-text">選單</span>
    </button>
    <nav class="site-nav" id="site-nav" data-nav aria-label="主選單">
      <ul role="list">
        <li><a href="index.html">首頁<span class="nav-en" aria-hidden="true">HOME</span></a></li>
        <li><a href="about.html">關於我們<span class="nav-en" aria-hidden="true">ABOUT</span></a></li>
        <li><a href="services.html">服務項目<span class="nav-en" aria-hidden="true">SERVICES</span></a></li>
        <li><a href="projects.html">工程實績<span class="nav-en" aria-hidden="true">PROJECTS</span></a></li>
        <li><a href="contact.html">聯絡我們<span class="nav-en" aria-hidden="true">CONTACT</span></a></li>
      </ul>
    </nav>
    <div class="header-cta">
      <a class="header-phone" data-attr="href:company.phoneHref">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        <span class="sr-only">來電</span>
        <span class="header-phone-num" data-bind="company.phone"></span>
      </a>
      <a class="btn btn--green header-btn" href="contact.html">工程洽詢</a>
    </div>
  </div>
</header>

<main id="main">

  <div class="page-head corrugated on-green">
    <div class="wrap page-head-inner">
      <p class="eyebrow" lang="en">CONTACT</p>
      <h1>聯絡我們</h1>
      <p class="page-lead" data-bind="copy.contactLead"></p>
    </div>
  </div>
  <div class="footing" aria-hidden="true"></div>

  <div class="section">
    <div class="wrap contact-layout">
      <section class="contact-info" aria-labelledby="info-title">
        <p class="eyebrow" lang="en">INFORMATION</p>
        <h2 class="contact-heading" id="info-title">聯絡資訊</h2>
        <div class="contact-phone on-white">
          <p class="board-label">工程洽詢專線</p>
          <a class="phone contact-phone-num" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
          <p class="contact-hours"><span class="contact-hours-label">營業時間</span><span data-bind="company.hours"></span></p>
        </div>
        <dl class="contact-list">
          <div class="contact-row"><dt>傳真</dt><dd data-bind="company.fax"></dd></div>
          <div class="contact-row"><dt>Email</dt><dd><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
          <div class="contact-row">
            <dt>地址</dt>
            <dd>
              <span class="contact-address" data-bind="company.address"></span>
              <a class="text-link map-link" data-map-link>在 Google 地圖開啟
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>
              </a>
            </dd>
          </div>
        </dl>
      </section>

      <section class="form-board on-white" aria-labelledby="form-title">
        <p class="eyebrow" lang="en">MESSAGE</p>
        <h2 class="contact-heading" id="form-title">線上留言</h2>
        <form class="contact-form" data-demo-form>
          <div class="field">
            <label for="f-name">姓名<span class="req" aria-hidden="true">必填</span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-phone">聯絡電話<span class="req" aria-hidden="true">必填</span></label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email">
          </div>
          <div class="field">
            <label for="f-type">工程類型</label>
            <select id="f-type" name="type">
              <option value="">請選擇</option>
              <template data-each="form.types"><option data-attr="value:item" data-bind="item"></option></template>
            </select>
          </div>
          <div class="field field--full">
            <label for="f-message">需求說明<span class="req" aria-hidden="true">必填</span></label>
            <textarea id="f-message" name="message" rows="6" required></textarea>
          </div>
          <div class="form-actions field--full">
            <p class="form-consent">
              <label><input type="checkbox" name="consent" required>我已閱讀並同意<a href="privacy.html">隱私權政策</a>，並同意<span data-bind="company.shortName"></span>為聯絡與工程洽詢的目的處理我提供的個人資料。</label>
            </p>
            <button class="btn btn--red" type="submit">送出留言</button>
            <p class="form-status" data-form-status hidden></p>
            <p class="form-note"><small data-bind="form.note"></small></p>
          </div>
        </form>
      </section>
    </div>
  </div>

  <section class="section section--flow" aria-labelledby="map-title">
    <div class="wrap">
      <div class="section-head">
        <div>
          <p class="eyebrow" lang="en">LOCATION</p>
          <h2 id="map-title">公司位置</h2>
        </div>
      </div>
      <div class="map-frame">
        <iframe data-map></iframe>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer on-green">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <img class="brand-mark" src="../shared/img/logo-mark.png" alt="" width="56" height="56">
      <p class="footer-name" data-bind="company.name"></p>
      <p class="footer-name-en" lang="en" data-bind="company.nameEn"></p>
    </div>
    <dl class="footer-info">
      <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
      <div><dt>統一編號</dt><dd data-bind="company.taxId"></dd></div>
      <div class="footer-info-wide"><dt>地址</dt><dd data-bind="company.address"></dd></div>
      <div><dt>電話</dt><dd><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
      <div><dt>傳真</dt><dd data-bind="company.fax"></dd></div>
      <div><dt>Email</dt><dd><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
      <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
    </dl>
    <nav class="footer-nav" aria-label="頁尾導覽">
      <ul role="list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="wrap footer-bottom">
    <p><small>© <span data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
  </div>
</footer>
</body>
</html>
