<!doctype html>
<html lang="zh-Hant-TW" data-style="d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服務項目｜範例營造股份有限公司</title>
<meta name="description" content="範例營造股份有限公司的服務項目：廠房、住宅與加油站新建工程，以及各項服務的相關工程實績。">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/img/favicon-32x32.png">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/content.js" defer></script>
<script src="../shared/site.js" defer></script>
<script src="style.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../shared/img/logo-mark.png" alt="" width="44" height="44">
      <span class="brand-text">
        <span class="brand-name" data-bind="company.shortName"></span>
        <span class="brand-en" lang="en" data-bind="company.shortNameEn"></span>
      </span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="nav-toggle-text">選單</span>
    </button>
    <nav class="site-nav" id="site-nav" data-nav aria-label="主選單">
      <ul role="list">
        <li><a href="index.html">首頁<span class="nav-en" aria-hidden="true">HOME</span></a></li>
        <li><a href="about.html">關於我們<span class="nav-en" aria-hidden="true">ABOUT</span></a></li>
        <li><a href="services.html">服務項目<span class="nav-en" aria-hidden="true">SERVICES</span></a></li>
        <li><a href="projects.html">工程實績<span class="nav-en" aria-hidden="true">PROJECTS</span></a></li>
        <li><a href="contact.html">聯絡我們<span class="nav-en" aria-hidden="true">CONTACT</span></a></li>
      </ul>
    </nav>
    <div class="header-cta">
      <a class="header-phone" data-attr="href:company.phoneHref">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        <span class="sr-only">來電</span>
        <span class="header-phone-num" data-bind="company.phone"></span>
      </a>
      <a class="btn btn--green header-btn" href="contact.html">工程洽詢</a>
    </div>
  </div>
</header>

<main id="main">

  <div class="page-head corrugated on-green">
    <div class="wrap page-head-inner">
      <p class="eyebrow" lang="en">SERVICES</p>
      <h1>服務項目</h1>
      <p class="page-lead" data-bind="copy.servicesLead"></p>
      <nav class="page-jump" aria-label="本頁服務項目">
        <ul role="list">
          <template data-each="services"><li><a data-attr="href:item.$href" data-bind="item.name"></a></li></template>
        </ul>
      </nav>
    </div>
  </div>
  <div class="footing" aria-hidden="true"></div>

  <div class="service-list">
    <template data-each="services">
      <section class="service-section" data-attr="id:item.id">
        <div class="wrap service-row">
          <div class="service-media" data-attr="data-illus:item.illus" data-ph-label="服務照片待補"></div>
          <div class="service-info">
            <p class="eyebrow" lang="en" data-bind="item.en"></p>
            <h2 class="service-title" data-bind="item.name"></h2>
            <p class="service-text" data-bind="item.desc"></p>
            <div class="related">
              <h3 class="related-title">相關實績<span class="related-count"><span class="num" data-bind="item.$count"></span>件</span></h3>
              <ul class="related-list" role="list">
                <template data-each="item.$projects">
                  <li>
                    <a class="related-link" data-attr="href:item.$href">
                      <span class="related-year num" data-bind="item.year"></span>
                      <span class="related-name" data-bind="item.name"></span>
                      <span class="related-loc" data-bind="item.location"></span>
                      <svg class="icon related-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
                    </a>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </div>
      </section>
    </template>
  </div>

  <section class="cta on-green" aria-labelledby="cta-title">
    <div class="cta-fence corrugated">
      <div class="wrap cta-inner">
        <div class="cta-copy">
          <p class="eyebrow" lang="en">CONTACT</p>
          <h2 id="cta-title" data-bind="copy.ctaTitle"></h2>
          <p class="cta-text" data-bind="copy.ctaText"></p>
        </div>
        <div class="cta-board on-white">
          <p class="board-label">工程洽詢專線</p>
          <a class="phone cta-phone" data-attr="href:company.phoneHref" data-bind="company.phone"></a>
          <a class="btn btn--red btn--block" href="contact.html">工程洽詢</a>
        </div>
      </div>
    </div>
    <div class="footing" aria-hidden="true"></div>
  </section>

</main>

<footer class="site-footer on-green">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <img class="brand-mark" src="../shared/img/logo-mark.png" alt="" width="56" height="56">
      <p class="footer-name" data-bind="company.name"></p>
      <p class="footer-name-en" lang="en" data-bind="company.nameEn"></p>
    </div>
    <dl class="footer-info">
      <div><dt>營造業登記證</dt><dd data-bind="company.license"></dd></div>
      <div><dt>統一編號</dt><dd data-bind="company.taxId"></dd></div>
      <div class="footer-info-wide"><dt>地址</dt><dd data-bind="company.address"></dd></div>
      <div><dt>電話</dt><dd><a data-attr="href:company.phoneHref" data-bind="company.phone"></a></dd></div>
      <div><dt>傳真</dt><dd data-bind="company.fax"></dd></div>
      <div><dt>Email</dt><dd><a data-attr="href:company.emailHref" data-bind="company.email"></a></dd></div>
      <div><dt>營業時間</dt><dd data-bind="company.hours"></dd></div>
    </dl>
    <nav class="footer-nav" aria-label="頁尾導覽">
      <ul role="list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="services.html">服務項目</a></li>
        <li><a href="projects.html">工程實績</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
  </div>
  <div class="wrap footer-bottom">
    <p><small>© <span data-bind="$year"></span> <span data-bind="company.name"></span></small></p>
  </div>
</footer>
</body>
</html>
